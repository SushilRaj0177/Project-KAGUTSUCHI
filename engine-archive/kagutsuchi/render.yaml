services:
  - type: web
    name: kagutsuchi-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt -r server/requirements.txt -r verification/requirements.txt"
    startCommand: "uvicorn server.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: .
      - key: GROQ_API_KEY
        sync: false
      - key: KAGUTSUCHI_ALLOWED_ORIGINS
        value: "*"
